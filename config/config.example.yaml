# macOS starter config. Windows users: copy config.example.windows.yaml instead.
# Copy to config.yaml and fill in real values. config.yaml is gitignored.
# Secrets (passwords/tokens) are NOT stored here — see secrets.example.yaml
# and the ${ENV_VAR} placeholders below, which are resolved from the
# environment (or from secrets.yaml) at load time.

git:
  repo_url: "git@github.com:youraccount/your-unity-project.git"
  branch: "main"
  workspace_root: "./workspace"       # fully deleted before each fresh clone
  workdir: "./workspace/repo"          # local clone used by the bot
  # Auth: prefer an SSH deploy key (read-only) already loaded in ssh-agent,
  # or set auth_token_env to the name of an env var holding a GitHub PAT
  # for HTTPS auth. Do not use username/password — GitHub no longer
  # supports it.
  auth_token_env: "GIT_TOKEN"          # optional, only for HTTPS remotes

unity:
  executable_path: "/Applications/Unity/Hub/Editor/2022.3.40f1/Unity.app/Contents/MacOS/Unity"
  project_subpath: "."                 # Unity project folder relative to workdir
  build_method: "BuildScript.PerformBuild"
  extra_args: []                       # e.g. ["-nographics"]
  # never | always | on_previous_failure.
  # A clean build discards Unity's incremental player/IL2CPP cache (Library/Bee)
  # and is much slower; the asset import cache is kept either way.
  # "on_previous_failure" only cleans when the last recorded run failed.
  clean_build: "never"
  builds:
    - id: "macos"
      enabled: true                     # false to skip macOS
      build_target: "StandaloneOSX"
      output_subdir: "workspace/build/macos"
      build_name: "Game"               # output filename, without .app
    - id: "windows"
      enabled: false                    # enable only if building both platforms
      build_target: "StandaloneWindows64"
      output_subdir: "workspace/build/windows"
      build_name: "Game"               # output filename, without .exe

versioning:
  version_file: "version.txt"          # relative to repo workdir root
  auto_increment: true
  bump_part: "patch"                   # patch | minor | major
  append_short_commit_hash: true        # append .<short SHA> to each build version
  short_commit_hash_length: 7

job:
  mode: "build_and_upload"             # build_and_upload | upload_only
  steam_upload_retries: 3               # additional attempts after a failed upload
  steam_upload_retry_delay_seconds: 30
  prevent_sleep: true                   # block idle sleep/App Nap while the job runs

steam:
  # Windows: C:/steamcmd/steamcmd.exe and C:/steamcmd/config/config.vdf
  steamcmd_path: "~/steamcmd/steamcmd.sh"
  config_vdf_path: "~/Library/Application Support/Steam/config/config.vdf"  # macOS SteamCMD session
  username: "your-steam-builder-account"
  app_id: "123456"
  depots:                              # keys must match unity.builds IDs
    macos: "123457"
  set_live_branch: ""                  # leave empty to upload without setting a branch live
  build_description: "{version} | {branch} | {short_sha} | {targets} | automated"

logging:
  log_dir: "~/.unity-build-bot/logs"   # kept outside any git repo on purpose
  level: "INFO"
  show_activity_window: false          # open a live terminal window on macOS or Windows

state:
  state_file: "~/.unity-build-bot/state.json"
