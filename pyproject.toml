[project]
name = "unity-build-bot"
version = "0.1.0"
description = "Local CI job: watches a git repo, builds a Unity project, and uploads the build to Steam via SteamPipe."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
unity-build-bot = "unity_build_bot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
